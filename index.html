<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3B0B2C">
<meta name="robots" content="noindex, nofollow">
<title>For Saniya 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--hot:#E0218A;--plum2:#5E1446}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{display:grid;place-items:center;padding:24px 16px;font-family:'Quicksand',system-ui,-apple-system,sans-serif;color:var(--plum2);
  background:radial-gradient(130% 85% at 50% 0%,#8E1F64 0%,#4A0E37 48%,#22061A 100%);-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:340px;text-align:center;background:linear-gradient(180deg,#fff,#FFF2F8);border-radius:28px;padding:32px 24px 26px;
  box-shadow:0 30px 70px rgba(0,0,0,.45),0 0 90px rgba(255,95,162,.25);animation:in .7s cubic-bezier(.2,.9,.3,1.1)}
@keyframes in{from{opacity:0;transform:translateY(20px) scale(.97)}}
.lock{font-size:54px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
h1{font-family:'Pacifico',cursive;font-weight:400;color:var(--hot);font-size:34px;line-height:1.2;margin:8px 0 6px}
p{font-weight:600;font-size:15px;line-height:1.5;opacity:.85}
input{width:100%;margin:20px 0 12px;padding:15px 18px;border-radius:999px;border:2px solid #FFD1E6;background:#fff;font:600 17px 'Quicksand',sans-serif;
  color:var(--plum2);text-align:center;outline:none;transition:border-color .2s}
input:focus{border-color:#FF8DC0}
button{width:100%;padding:15px;border:0;border-radius:999px;background:linear-gradient(180deg,#FF4FA3,var(--hot));color:#fff;font:700 17px 'Quicksand',sans-serif;
  box-shadow:0 10px 24px rgba(224,33,138,.38);cursor:pointer}
button:active{transform:scale(.97)}
.err{min-height:22px;margin-top:12px;color:var(--hot);font-weight:700;font-size:14px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="lock">🔐</div>
  <h1>For Saniya only</h1>
  <p>Something special is locked inside.<br>Enter the secret password 💗</p>
  <noscript><p style="margin-top:14px;color:#E0218A"><b>Please open this link in Safari or Chrome.</b></p></noscript>
  <input id="pw" type="password" placeholder="password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
  <button type="submit" id="go">Unlock 🎀</button>
  <div class="err" id="err"></div>
</form>

const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt: bytes(D.salt), iterations: 200000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: bytes(D.iv) }, key, bytes(D.ct));
  return new TextDecoder().decode(plain);
}
function open(html){ document.open(); document.write(html); document.close(); }
const f = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('go');
f.addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value.trim().toLowerCase();
  if (!pw) return;
  if (!window.crypto || !crypto.subtle){ err.textContent = 'Please open this link in Safari or Chrome 💗'; return; }
  btn.textContent = 'Unlocking…'; btn.disabled = true;
  try {
    const html = await unlock(pw);
    try { sessionStorage.setItem('sp', pw); } catch(_){}
    open(html);
  } catch(_){
    btn.textContent = 'Unlock 🎀'; btn.disabled = false;
    err.textContent = "Hmm, that's not it 🥺 try again";
    f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
  }
});
(async () => { let s = null; try { s = sessionStorage.getItem('sp'); } catch(_){}
  if (s && window.crypto && crypto.subtle){ try { open(await unlock(s)); } catch(_){} } })();
</script>
